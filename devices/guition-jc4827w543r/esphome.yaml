# User-facing production configuration. Set the device identity and Wi-Fi
# credentials locally; the package supplies the complete EspControl firmware.
substitutions:
  name: "your-device-name"
  friendly_name: "Your Device Name"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  api_encryption:
    url: https://github.com/shahvirb/espcontrol-jc4827w543r/
    file: common/addon/api_encryption_dynamic.yaml
    refresh: 1s
  setup:
    url: https://github.com/shahvirb/espcontrol-jc4827w543r/
    file: devices/guition-jc4827w543r/packages.yaml
    refresh: 1s
